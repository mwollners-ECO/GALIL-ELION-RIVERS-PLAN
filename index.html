<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מפת העבודה – נחלי מקורות הירדן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a basin-to-lake flow — stages run right-to-left like the water, stage 2 opens into a field of chapter "tributaries" feeding the synthesis. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --surface-2:#e8efea; --ink:#16302a; --muted:#56706a; --line:#c9d8d1;
  --water:#1f6f8b; --water-soft:#d6e9f0; --reed:#a8742a; --reed-soft:#f3e6cf;
  --o-gal:#ffe066; --o-nati:#9fd3f5; --o-angel:#a8e6a1; --o-haran:#f5b3d6; --o-none:#d9d9d9; --o-map:#ffc48c; --o-nili:#c9b6f2; --o-michal:#f7a8a0; --o-ink:#1b1b1b;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,"Segoe UI",sans-serif;
  --r:10px; --stem:#3d6b4e; --leaf:#6fa36b; --petal:#e9c98f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a18; --surface:#16231f; --surface-2:#1d2d28; --ink:#e3eeea; --muted:#9db3ac; --line:#2c3f39;
  --water:#6cc1dc; --water-soft:#163a46; --reed:#e0aa5c; --reed-soft:#3a2d17; --stem:#8cc49a; --leaf:#5f9a63; --petal:#c99a52;
  --o-gal:#e6c84a; --o-nati:#79b9e0; --o-angel:#86c97e; --o-haran:#e08fb9; --o-none:#9a9a9a; --o-map:#e0a46a; --o-nili:#a58fd6; --o-michal:#e0857b; --o-ink:#111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a18; --surface:#16231f; --surface-2:#1d2d28; --ink:#e3eeea; --muted:#9db3ac; --line:#2c3f39;
  --water:#6cc1dc; --water-soft:#163a46; --reed:#e0aa5c; --reed-soft:#3a2d17; --stem:#8cc49a; --leaf:#5f9a63; --petal:#c99a52;
  --o-gal:#e6c84a; --o-nati:#79b9e0; --o-angel:#86c97e; --o-haran:#e08fb9; --o-none:#9a9a9a; --o-map:#e0a46a; --o-nili:#a58fd6; --o-michal:#e0857b; --o-ink:#111; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.kick{font:600 13px var(--f-body);letter-spacing:.08em;color:var(--water)}
header.top h1{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.chip{font:600 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--bg)}
button:focus-visible,.node:focus-visible{outline:3px solid var(--reed);outline-offset:2px}
.lbl{font:700 12px var(--f-body);letter-spacing:.06em;color:var(--muted)}
section.view{margin-top:22px}
/* Flow: one quiet timeline strip, then the chapters as a clean grid */
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stage{flex:1 1 0;min-width:120px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;padding:0 0 4px;text-align:right;cursor:pointer;font:inherit;color:var(--muted)}
.stage .bar{display:block;width:100%;height:6px;border-radius:3px;background:var(--line);margin-bottom:8px}
.stage .sn{font:600 13px var(--f-display);font-variant-numeric:tabular-nums}
.stage b{font:600 15px var(--f-display);color:var(--ink);line-height:1.3}
.stage .m{font-size:13px;font-variant-numeric:tabular-nums}
.stage.cur .bar{background:var(--water)}
.stage.cur .sn,.stage.cur .m{color:var(--water)}
.stage:hover .bar{background:var(--water-soft)}
.stage.cur:hover .bar{background:var(--water)}
.tracks{margin:14px 0 0;font-size:14px;color:var(--muted)}
.tracks b{color:var(--ink);font-weight:600}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin:34px 0 12px}
.sec-h h2{font-size:20px}
.sec-h .m{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:right;font:inherit;color:inherit;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:6px;align-items:start;min-width:0}
.node:hover{border-color:var(--water)}
.node .n{grid-row:1/3;font:600 20px var(--f-display);color:var(--water);font-variant-numeric:tabular-nums;min-width:1.4em;line-height:1.2}
.node b{font:600 15px var(--f-display);line-height:1.35}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.node.syn{background:var(--reed-soft);border-color:transparent}
.node.syn .n{color:var(--reed)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:13px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.cross{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.cross span.c{background:var(--water-soft);color:var(--ink);border-radius:6px;padding:3px 10px}
.tag{display:inline-block;font-weight:700;font-size:13px;padding:1px 8px;border-radius:5px;color:var(--o-ink)}
.t-gal{background:var(--o-gal)}.t-nati{background:var(--o-nati)}.t-angel{background:var(--o-angel)}.t-haran{background:var(--o-haran)}.t-none{background:var(--o-none)}.t-map{background:var(--o-map)}.t-nili{background:var(--o-nili)}.t-michal{background:var(--o-michal)}
.ctrl{border:1px solid var(--o-michal);border-inline-start:5px solid var(--o-michal);border-radius:8px;padding:8px 12px;margin:12px 0;background:color-mix(in srgb,var(--o-michal) 12%,transparent)}
.ctrl p{margin:4px 0 0}
a.src{color:inherit;text-decoration:underline;text-decoration-color:var(--o-nati);text-underline-offset:2px}
/* Plant: stage 2 as a stem — chapters are leaves, synthesis is the flower, intro chapters are the roots */
.plant{position:relative;max-width:860px;margin:6px auto 0;padding-block:6px 0}
.stem{position:absolute;left:calc(50% - 20px);width:40px;top:80px;height:calc(100% - 180px);overflow:visible}
.stem path{fill:none;stroke:var(--stem);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.crown{display:flex;justify-content:center;position:relative;z-index:1}
.bud{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font:inherit;color:inherit;text-align:center;padding:4px 10px}
.bud svg{width:84px;height:84px;overflow:visible}
.petal{fill:color-mix(in srgb,var(--petal) calc(35% + var(--p) * .65%),var(--bg));stroke:var(--reed);stroke-width:1.2}
.core{fill:var(--reed)}
.bud .lt{align-items:center;background:var(--bg);padding:2px 10px;border-radius:6px;position:relative;z-index:2}
.lrow{position:relative;z-index:1;display:flex;width:50%;direction:ltr}
.lrow + .lrow{margin-top:-14px}
.lrow.r{margin-left:50%;justify-content:flex-start;padding-left:2px}
.lrow.l{margin-right:50%;justify-content:flex-end;padding-right:2px}
.leaf{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;font:inherit;color:inherit;direction:ltr;max-width:100%}
.lrow.l .leaf{flex-direction:row-reverse}
.blade{width:116px;height:45px;flex:none;overflow:visible;transform-origin:center;transform:rotate(-16deg);transition:transform .25s}
.lrow.l .blade{transform:scaleX(-1) rotate(-16deg)}
.blade .b{fill:color-mix(in srgb,var(--leaf) calc(16% + var(--p) * .84%),var(--bg));stroke:var(--stem);stroke-width:1.3}
.blade .rib{fill:none;stroke:var(--stem);stroke-width:1.1}
.blade .vein{fill:none;stroke:var(--stem);stroke-width:.7;opacity:.55}
.lt{direction:rtl;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;min-width:0}
.lrow.l .lt{align-items:flex-end;text-align:left}
.lrow.l .lt{align-items:flex-start;text-align:right}
.lt .n{font:600 13px var(--f-display);color:var(--stem);font-variant-numeric:tabular-nums}
.lt b{font:600 15px var(--f-display);line-height:1.3;max-width:24ch}
.lt .meta{display:flex;gap:8px;align-items:center}
.lt .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.leaf:hover b,.bud:hover b,.seed:hover b{color:var(--water)}
.lrow.r .leaf:hover .blade{transform:rotate(-22deg)}
.lrow.l .leaf:hover .blade{transform:scaleX(-1) rotate(-22deg)}
.leaf:focus-visible,.bud:focus-visible,.seed:focus-visible{outline:3px solid var(--reed);outline-offset:3px;border-radius:8px}
.roots{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-4px}
.rootlines{width:220px;height:56px}
.rootlines path{fill:none;stroke:var(--stem);stroke-width:1.4;opacity:.6;vector-effect:non-scaling-stroke;stroke-linecap:round}
.seeds{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.seed{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;font:inherit;color:inherit}
.seed .lt{flex-direction:row;align-items:center;gap:8px}
.seed .lt b{font-size:14px}
@media (max-width:640px){
  .stem{left:auto;right:4px;top:40px;height:calc(100% - 140px)}
  .crown{justify-content:flex-start}
  .lrow.l,.lrow.r{margin:0;width:auto;padding-right:22px;padding-left:0;justify-content:flex-end}
  .lrow + .lrow{margin-top:0}
  .lrow.l .leaf,.lrow.r .leaf{flex-direction:row-reverse}
  .lrow.l .blade,.lrow.r .blade{width:84px;height:33px;transform:scaleX(-1) rotate(-12deg)}
  .lrow.r .leaf:hover .blade{transform:scaleX(-1) rotate(-18deg)}
  .roots{align-items:flex-start}
  .rootlines{display:none}
  .seeds{justify-content:flex-start;padding-right:22px}
}
@media (prefers-reduced-motion:reduce){.blade{transition:none}}
/* Detail */
.detail{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.detail[hidden]{display:none}
.detail .dh{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.detail h2{font-size:22px}
.detail h3{font-size:17px;margin:18px 0 6px;color:var(--water)}
.detail h4{font:600 15px var(--f-display);margin:14px 0 4px}
.detail p{margin:6px 0;max-width:80ch}
.detail ul{margin:4px 0;padding-inline-start:22px}
.detail ul ul{padding-inline-start:18px}
.detail li{margin:2px 0}
.close{font:600 14px var(--f-body);background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{background:var(--water);color:var(--bg);text-align:right;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.ln{display:block}
details.cmp{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--surface-2)}
details.cmp summary{cursor:pointer;padding:8px 12px;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.cmp .body{padding:0 12px 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
details.cmp .body > div{min-width:0}
/* Lists */
.picker{display:flex;flex-wrap:wrap;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}
.chip .tag{margin-inline-start:6px}
.sum{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 4px;color:var(--muted)}
.sum strong{color:var(--ink);font-variant-numeric:tabular-nums}

/* Gantt */
.gantt-wrap{margin-top:0}
.gantt{min-width:1400px;font-size:14px}
.gr{display:grid;grid-template-columns:230px minmax(0,1fr) 56px;border-bottom:1px solid var(--line);align-items:stretch}
.gr.gst{background:var(--surface-2)}
.gr .gl{padding:6px 8px;min-width:0;overflow-wrap:anywhere;text-align:right;font:inherit;color:inherit;background:none;border:0}
.gr button.gl{cursor:pointer}
.gr.sub .gl{padding-inline-start:22px;color:var(--ink)}
.gr.gst .gl{font-weight:700}
.gr .gp{text-align:center;padding-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
.trk{position:relative;min-height:30px;background-image:repeating-linear-gradient(to left,transparent 0,transparent calc(100%/24 - 1px),var(--line) calc(100%/24 - 1px),var(--line) calc(100%/24))}
.gbar{position:absolute;top:7px;bottom:7px;border-radius:5px;background:var(--water-soft);border:1px solid var(--water);overflow:hidden;z-index:1}
.gbar > i{display:block;height:100%;background:var(--water)}
.gbar.gstb{background:var(--water);border-color:var(--water)}
.gbar.gstb.cur{background:var(--water-soft)}
.gbar.syn{background:var(--reed-soft);border-color:var(--reed)}.gbar.syn > i{background:var(--reed)}
.gbar.plain{background:var(--surface-2);border-style:dashed}
.gms{position:absolute;top:50%;width:12px;height:12px;background:var(--reed);transform:translate(50%,-50%) rotate(45deg);z-index:3}
.gml{position:absolute;top:2px;transform:translateX(50%);font:700 11px var(--f-body);color:var(--reed);white-space:nowrap;z-index:3}
.gsc{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:var(--muted);transform:translate(50%,-50%);z-index:3}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--reed);z-index:2}
.ghd .trk{min-height:62px;background-image:none}
.ghd .yr{position:absolute;top:2px;padding-inline-start:4px;border-inline-start:2px solid var(--water);font:700 12px var(--f-body);color:var(--ink);line-height:1.2}
.ghd .tick .mn{font-weight:400;opacity:.8}
.ghd .tick{position:absolute;top:20px;font:600 10px var(--f-body);color:var(--muted);transform:translateX(50%);white-space:nowrap;text-align:center;line-height:1.3}
.ghd .band{position:absolute;bottom:0;height:5px;border-radius:2px;background:var(--water-soft)}
.ghd .band.cur{background:var(--water)}
/* Checklist */
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--water);flex:none}
details.cmp.done summary{opacity:.75}
details.cmp.done summary .ttl{text-decoration:line-through}
.prog{height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:140px;flex:1;max-width:320px}
.prog > i{display:block;height:100%;background:var(--water)}
.upl{font:700 14px var(--f-body);background:var(--water);color:var(--bg);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
/* Files */
.note{color:var(--muted);margin:0 0 12px;max-width:80ch}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.folder{display:flex;gap:10px;align-items:center;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.folder:hover,.folder[aria-pressed="true"]{border-color:var(--water)}
.folder.bg{grid-column:1/-1;background:var(--reed-soft);border-color:var(--reed)}
.folder svg{flex:none;width:28px;height:22px}
.folder .fi{min-width:0;display:flex;flex-direction:column}
.folder .fi b{font:600 15px var(--f-display);overflow-wrap:anywhere}
.folder .fi span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.flist{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.flist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.flist .kind{font:700 11px var(--f-body);letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--water-soft);color:var(--ink)}
.flist .kind.link{background:var(--reed-soft)}
.flist a{color:var(--water);font-weight:700;overflow-wrap:anywhere}
.flist .meta{color:var(--muted);font-size:13px;margin-inline-start:auto}
.flist .del{font:600 13px var(--f-body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
.cat{margin:16px 0 4px;font:600 15px var(--f-display);color:var(--reed)}
.add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.add form{display:flex;flex-direction:column;gap:8px;min-width:0}
.add label{font-weight:700;font-size:14px}
.add select,.add input[type=text],.add input[type=url]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.add button[type=submit]{align-self:flex-start;font:600 14px var(--f-body);background:var(--water);color:var(--bg);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
.add button[disabled]{opacity:.5;cursor:default}
.msg{font-size:14px;min-height:1.2em;color:var(--muted)}
.msg.err{color:#b4442b}
@media (max-width:700px){.add{grid-template-columns:1fr}}
@media (max-width:600px){.stage{min-width:40%}.cgrid{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.cgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.node,.stage{transition:border-color .15s}}
</style>
<style>body{margin:0;background:var(--bg)} a.upl{display:inline-block;text-decoration:none}</style>
</head>
<body>


<div class="wrap" dir="rtl">
  <header class="top">
    <div>
      <div class="kick">מפת העבודה</div>
      <h1>נחלי מקורות הירדן</h1>
    </div>
    <nav class="tabs" aria-label="תצוגה">
      <button id="tab-flow" aria-pressed="true" data-v="flow">תהליך</button>
      <button id="tab-time" aria-pressed="false" data-v="time">לוח זמנים</button>
      <button id="tab-dom" aria-pressed="false" data-v="dom">לפי תחום</button>
      <button id="tab-ppl" aria-pressed="false" data-v="ppl">לפי איש צוות</button>
      <button id="tab-files" aria-pressed="false" data-v="files">חומרים</button>
    </nav>
  </header>

  <section class="view" id="v-flow">
    <div class="stages" id="stages"></div>
    <p class="tracks">במקביל לכל השלבים: <b>ניהולי</b> · <b>פרוגרמטי</b> · <b>סטטוטורי</b></p>
    <div class="sec-h"><h2>מסמך שלב 2</h2><span class="m" id="st2-lbl"></span></div>
    <div class="plant" id="plant"></div>
    <div class="legend" id="legend"></div>
    <article class="detail" id="detail" hidden></article>
  </section>

  <section class="view" id="v-time" hidden>
    <section class="gantt-wrap" aria-labelledby="gantt-h">
      <div class="sec-h"><h2 id="gantt-h">לוח זמנים · 24 חודשים</h2><span class="m" id="gantt-total"></span></div>
      <p class="note">◆ אבן דרך ותשלום · ● ועדת היגוי · הקו הכתום: היום</p>
      <div class="tw"><div class="gantt" id="gantt"></div></div>
    </section>
  </section>

  <section class="view" id="v-dom" hidden>
    <div class="picker" id="dom-picker"></div>
    <article class="detail" id="dom-detail"></article>
  </section>

  <section class="view" id="v-files" hidden>
    <p class="note" id="files-note">טוען את רשימת החומרים…</p>
    <div class="folders" id="folders"></div>

ים שנפגעו; מקטעים בלי תחזוקה","כל הפרקים"]]],["h2","1.5 החזון, המטרות ומצב הבסיס"],["p","ה-TOR קובע חזון: מערכת מים חיה ורציפה מהמעיינות ועד גשר הפקק, בניהול גוף מתכלל אחד. הוא קובע גם 7 מטרות ויעדים עם ערכי יעד לשנת 2036. **סקר המצב הקיים מודד לכל יעד את מצב הבסיס, ובסינתזה (13) מציע ערכי יעד מעודכנים.**"],["tbl",["מטרה","מדדי בסיס שהמסמך מודד","פרקים"],[["**מערכת מים חיה**","ספיקות בסיס ושפל לכל קטע; מצב איכות המים בכל תחנה; ק\"מ תעלות עם מאפיינים טבעיים; דונמים של שטחי הצפה","ניקוז (3), אקולוגיה (4)"],["**רצף טבע**","דונמים של בתי גידול לחים; מלאי חסמי מעבר; אחוז האורך עם רצועת גדות טבעית; מקלטי אקלים – מיקום, גודל, רציפות ביניהם לנחלים","אקולוגיה (4)"],["**מרחב ציבורי**","מוקדי פנאי ותיירות עם תשתית ובלעדיה; ק\"מ שבילים רציפים; מקטעים בעומס יתר; אתרים נגישים; חניוני יום ולילה – מוסדרים ולא מוסדרים","תיירות (7), תשתיות (8), איכות סביבה (9)"],["**ניהול אחד**","גופים, כיסוי התחזוקה, תקציבים, הכנסות עצמיות, ניטור; מצב יוזמת התאגיד","ניהול (11)"],["**חקלאות וקהילה**","ק\"מ עיבוד עד כתף הערוץ; מוקדי קונפליקט; מעורבות היישובים","חקלאות (6), קהילה (10)"],["**חוסן ושיקום**","שטחים שנפגעו במלחמה; שטחים בסיכון הצפה לפי הסתברות – ניתוח אזורים בסיכון בעקבות שינויי אקלים (הצפה/התייבשות/אחר)","כל הפרקים, ניקוז (3)"],["**ודאות תכנונית**","המצב הסטטוטורי, ופרויקטים שממתינים למסגרת; מתחמים ומוכנותם לביצוע","סטטוטוריקה (2), מתחמים (12)"]]],["h2","1.6 תמ\"א 1 – פרק הנחלים כמסגרת"],["p","**מעמד.** התכנית אינה \"תוכנית לנחל\" במובן של תמ\"א 1: זו תכנית אזורית שחורגת מתחום הנחלים, וסוג התכנית הסטטוטורית ייקבע בשלב הראשון. עם זאת, פרק הנחלים בתמ\"א 1 מחייב כל תכנית במרחב, ו\"תוכנית לנחל\" יכולה לשמש כלי במקטעים שבהם תידרש. \"תוכנית לנחל\" היא \"תכנית שעיקרה תכנון הנחל לכל אורכו או לחלק משמעותי ממנו\", והיא מתכננת את כל מרחב הנחל, מהאפיק ועד פשט ההצפה, כמערכת אחת."],["p","**המצב הקיים.** כל עוד אין תכנית לנחל, חלים רוחבי ברירת מחדל: רצועת מגן של 5 מ', ורצועת השפעה של 100 מ' לכל צד בנחל ראשי ו-50 מ' לכל צד בנחל משני. המסמך מציג את הרוחבים האלה כמצב הסטטוטורי הקיים, ובודק מה נמצא בתוכם בפועל."],["p","**מה \"תוכנית לנחל\" קובעת:**"],["b","חמישה תחומים: אפיק לפי מדידה עדכנית, רצועת מגן, רצועת השפעה, פשט הצפה ושטחי הצפה.",0],["b","חלוקה למקטעים לפי יחידות מורפולוגיות וייעודי קרקע.",0],["b","שימושים לכל תחום.",0],["b","מסמך שיקולים הידרולוגיים, מורפולוגיים ואקולוגיים.",0],["p","**מה נבדק כבר בשלב זה, בכל מסלול שייבחר:**"],["b","מדידת האפיק ונקודות המדידה.",0],["b","רוחבי ברירת המחדל כמצב קיים.",0],["b","סיווג הנחלים.",0],["b","ניתוח ראשוני של פשט ההצפה ושל שטחי ההצפה.",0],["b","חלוקה ראשונית למקטעים.",0],["b","מיפוי תכניות ומפעלי ניקוז, שגוברים על תמ\"א 1.",0],["p","**דוגמה:** תכנית נחל שניר (253-0617639) קובעת, בין היתר, רצועת נחל, מרחקים של בנייה, קמפינג ותאורה מציר הנחל, שימור פשטי הצפה ורצועת מאנדרים, ומיקום של תחנות שיט ושבילים. המסמך צריך לספק את המידע שעליו נשענים כללים כאלה בכל המרחב."],["ctrl","mid",1],["h2","1.7 תכנית LIFE \"חיים לירדן – אדם וטבע\" (2009)"],["p","**מה היא:** \"תכנית אב ומימשק\" שהוכנה למנהלת נחלי מקורות הירדן, בניהול מוא\"ז הגליל העליון ובמימון קרן LIFE של האיחוד האירופי."],["p","**תחום:** כ-300,000 דונם, מגבול לבנון ועד הכנרת, בערך פי עשרה מתחום התכנית הנוכחית."],["p","**מטרה מוצהרת:** ממשק בר-קיימא בין הנחלים, החקלאות, התיירות והקהילות. בנוסף, \"בסיס להכנת תכנית/תכניות סטטוטוריות\". התכנית היא מסמך מדיניות ואינה סטטוטורית."],["p","**מבנה:** סקרי מצב קיים, המלצות, ו-45 מקטעים, לכל אחד קיבולת תיירותית."],["p","**אזוריה, והיחידות המרחביות של התכנית הנוכחית שבהן הם נמצאים:**"],["b","קריית שמונה–עיון: יחידות 9 ו-5, חלקית בתחום.",0],["b","משולש הנחלים: יחידות 1–4.",0],["b","ארץ התעלות ולב החולה: יחידות 4–7.",0],["b","רצועת מעיינות הדופן: יחידות 8–9, חלקית בתחום.",0],["b","מישור המטעים, מורדות כורזים והירדן ההררי: ברובם מחוץ לתחום (לבדיקה).",0],["tbl",["נושא","מה LIFE המליצה","מה בודקים היום"],[["**רצועות ומעבר**","אין בינוי עד 100 מ' מקו המים; רצועה של 50 מ' מכל גדה פתוחה לציבור","השוואה לרוחבי תמ\"א 1; איפה המעבר נחסם (סטטוטוריקה (2))"],["**הסטת פיתוח**","אין מוקדי תיירות ברצועות הנחלים; ניוד זכויות מאתרים רגישים","זכויות מאושרות שלא מומשו ליד הנחלים (סטטוטוריקה (2))"],["**פיזור עומסים**","מינימום פיתוח במשולש הנחלים; הפניית קהל לארץ התעלות; 19 חניונים מוצעים","אילו חניונים הוקמו; האם העומס ירד (תיירות (7))"],["**תעלות**","הסבה לתוואי כמו-טבעי, ופתרון לכל תעלה","ק\"מ שכבר הוסבו (ניקוז (3), אקולוגיה (4))"],["**מים**","הקצאה לטבע; אין שאיבה נוספת; 75% מהשטחים הלחים בשמורה התייבשו (2009)","האם נקבעה הקצאה לטבע (ניקוז (3), אקולוגיה (4))"],["**השבה לטבע**","כ-5,000 דונם בתוך עשור","כמה הושב בפועל, מול יעדי ה-TOR (אקולוגיה (4))"],["**חקלאות**","75% מהמרחב בעיבוד; חקלאות ידידותית; רצועות בר","היקף היום; רצועות חיץ (חקלאות (6))"],["**לינה ושיט**","איסור לינת שטח; 2,000 אוהלים; תנאי מרחק לחניוני לילה; הקפאת היקף השיט","קיבולת וקמפינג לא מוסדר; היקף השיט היום (תיירות (7))"],["**ניהול ומימון**","מנהלת כגג; תחזוקה ציבורית; אין סגירת נחלים לגבייה","מי מנהל ומי מממן היום (ניהול (11))"],["**מחקרים מומלצים**","כושר נשיאה, השפעות שיט, ביקושי לינה, מקורות זיהום, קידוחים לא מנוצלים","מה בוצע; היתר נכנס לפערי הידע (סינתזה (13))"]]],["p","**מה נדרש לעשות ביחס ל-LIFE: - מיכל/ הרן**"],["b","בדיקת מימוש של כל המלצה, ולמה המלצות לא מומשו: מעמד, גוף מנהל, מימון או הסכמות.",0],["b","הצלבת 45 המקטעים שלה עם היחידות המרחביות.",0],["b","תרגום העקרונות שלה לכלים סטטוטוריים עדכניים, כולל תמ\"א 1. LIFE נכתבה מול תמ\"א 34/ב/3 ותמ\"א 35.",0],["b","כיול היעדים הכמותיים שלה מול יעדי ה-TOR.",0],["b","תרגום ההמלצות שלא מומשו למתחמים ולפרויקטים ברי ביצוע (מתחמים (12)). התכנית היא ההמשך המעשי של LIFE.",0],["h2","1.8 יחידות מרחביות ומקטעים"],["p","**מרחב הניתוח:** הגליל העליון ועמק החולה, בחשיבה אזורית ולא שרוולית. היחידות כוללות גם את מוקדי הביקור, דרכי הגישה והתשתיות שמשרתות אותם, מחוץ לרצועות הנחלים."],["p","כל הפרקים משתמשים באותן 9 יחידות מרחביות:"],["b","נחל דן",0],["b","נחל חרמון",0],["b","נחל שניר",0],["b","הירדן העליון, עד גשר הפקק",0],["b","תעלות ראשיות",0],["b","תעלות משניות",0],["b","השמורה, האגמון והירדן ההיסטורי",0],["b","מעיינות שולי העמק",0],["b","יובלים ממורדות נפתלי והגולן: עיון, זהב, קדש, דישון, מחניים ונחלי הגולן",0],["p","**גל יכין את מפת חלוקת המקטעים**"],["p","**מקטעי תכנון:** בעלי גבולות ברורים בשטח, ונקבעים לפי יחידות מורפולוגיות וייעודי קרקע. לכל מקטע יוכן כרטיס מקטע (סינתזה (13))."],["h2","1.9 עקרונות עבודה וכתיבה"],["p","**עקרונות עבודה:**"],["b","**תבנית היעד:** כל פרק הוא הבסיס לנספח המקביל בשלב 4.",0],["b","**מימוש:** כל פרק מספק תשומות למתחמים, למודל הניהול ולתכנית הסטטוטורית.",0],["b","**ידע קיים קודם:** מתחילים מהידע הקיים, וסקרים חדשים נערכים רק כדי להשלים פערים.",0],["b","**המשך מעשי של LIFE:** בכל פרק בודקים מה מהמלצות LIFE ותכניות האב מומש, ומה מנע את המימוש.",0],["b","**עקרונות פרק הנחלים בתמ\"א 1:** משמשים עדשה לניתוח: רציפות, פיתולים, אגן חזותי, ראייה אגנית והחזרה למצב טבעי.",0],["p","**עקרונות כתיבה:**"],["b","**קונקרטיות:** כל ממצא מעוגן במקום, בכמות ובמקור.",0],["b","**מגמות:** מציינים את כיוון השינוי ואת טווח השנים.",0],["b","**השוואה:** כל ממצא מושווה ליחידות אחרות.",0],["b","**ודאות:** מסמנים אם הנתון ידוע, מוערך או לא ידוע.",0],["b","**בלי הנחיות:** המסמך לא קובע הוראות.",0],["h2","1.10 מתודולוגיה ומקורות"],["b","**מסד GIS:** ברשת ITM, בקנה מידה 1:5,000 לפחות, בקטגוריות שאפשר לתרגם לייעודי מבא\"ת. המסד נמסר למזמין ולגוף המנהל. – **לדייק עם גל**",0],["b","**סקרים:** בהכנה",0],["h2","1.11 צוות, אחריות להשלמה ושיתוף ציבור"],["tbl",["פרק","יועץ מוביל","אחראי להשלמה"],[["**סטטוטוריקה (2)**","מתכנן ראשי","**להשלמה: נתי**"],["**קרקע, ניקוז והידרולוגיה (3)**","הידרולוג ומהנדס ניקוז","**להשלמה: אנג'ל ורן**"],["**אקולוגיה (4), איכות סביבה (9)**","אקולוג, יועץ איכות סביבה","**להשלמה: גל ונעמה**"],["**נוף ומורשת (5)**","אדריכל נוף","**להשלמה: הרן ויוחאי**"],["**חקלאות (6), תיירות (7), תשתיות (8), קהילה (10), ניהול ותאגיד (11)**","יועצי התחום","**להשלמה: לשיוך**"],["**מתחמים (12)**","מתכנן ראשי, יועצי תשתיות, יועץ גיוס משאבים","**להשלמה: לשיוך**"]]],["p","היבטי הקרקע והגיאוגרפיה בכל הפרקים באחריות **להשלמה: גל ונעמה** ."],["p","**ועדת ההיגוי:** המשרד להגנת הסביבה, רט\"ג, קק\"ל, רשות הניקוז, אגודת מים בגליל והרשויות המקומיות. מתכנסת בכל אבן דרך, ולפחות פעם ברבעון."],["p","**שיתוף הציבור:** סבב 1 מתקיים בשלב זה. הממצאים נכנסים לפרק קהילה (10) ולסינתזה (13). **– רן – צריך להכניס לתמונה יועץ רלוונטי**"],["h2","1.12 מבנה הפרקים"],["p","פרקים 2–12 בנויים באותו מבנה. בכל פרק מופיע רק מה שייחודי לו:"],["b","**סקירה כוללת:** מטריצת השוואה בין 9 היחידות, דפוסים ומגמות, מוקדים, סוגיות רוחב וממצאים מרכזיים. נכתבת אחרונה.",0],["b","**ניתוח לפי רכיבים:** טבלה שבה לכל רכיב מפורטים מה בודקים, התוצר הנדרש והמקור.",0],["b","**פרקי רוחב:** שינוי אקלים לפי תרחישים משותפים, כושר נשיאה, והשלכות המלחמה. הכיוונים המפורטים בכל פרק הם לבחירה ולהרחבה.",0],["b","**סינתזה:** מפה לפי מקטע, תשומות לתכנית הסטטוטורית ולמתחמים, סוגיות לתכנית הפרוגרמטית, ופערי ידע.",0],["ctrl","end",1],["h1","2. סטטוטוריקה, תכניות ובעלויות"],["p","הפרק מרכז שתי שכבות: התכניות הסטטוטוריות, ותכניות האב והתכניות האסטרטגיות שכבר הוכנו למרחב. השאלה המרכזית היא מה כבר הוסכם ותוכנן, מה מומש, ומה עדיין לא מעוגן סטטוטורית."],["tags",["!!להשלמה: נתי","!!בעלויות ושימושי קרקע בפועל: גל ונעמה"]],["p","**סקירה כוללת:**"],["b","**המרחב במבט-על:** רשויות, ועדות, מחוז צפון, גבולות מדיניים ורגישות ביטחונית",0],["b","**מטריצת השוואה:** מידת ההגנה הסטטוטורית, ייעודים, בעלויות, תכניות נחל קיימות ופערים",0],["b","**דפוסים ומגמות:** שטחים מוגנים מול שטחי חקלאות וניקוז ללא הגנה; המלצות שחוזרות מתכנית לתכנית כבר 20 שנה ולא מומשו",0],["b","**סוגיות רוחב:** פער בין ייעוד לשימוש; רצועות נחל שאינן מעוגנות; הקצאת מים לטבע ללא מעמד; שימושים לא מוסדרים",0],["tbl",["רכיב","מה בודקים ומה כבר קיים","תוצר נדרש (מקור)","מקורות והשלמות"],[["2.2.1 תכניות אסטרטגיות ותכניות אב",["• תכנית LIFE \"חיים לירדן\" (2009)","• \"לב החולה\" (2025), \"גליל ולתמיד\" (2024)","• ראייה כוללת לשיט (2023), ניהול מבקרים בתעלת הירדן (2020)","• שטחים פתוחים, שבילי אופניים, שימור אתרים, חקלאות","• המלצות שנוגעות לנחלים וסטטוס מימוש","!!להשלמה: נתי"],"טבלה מרוכזת של כל ההמלצות שנוגעות לנחלים: מה, איפה, סטטוס מימוש, והלימה בין התכניות (אתר המועצה)",["• [תכנית LIFE \"חיים לירדן – אדם וטבע\": תכנית אב וממשק לנחלי מקורות הירדן (2009)]( const md = s => esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,(m,t,u)=>`<a class="src" href="${u.replace(/"/g,'%22')}" target="_blank" rel="noopener">${t}</a>`).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const CTRL={mid:['בקרת ניהול – אמצע הפרק','בדיקת שלמות לפני המעבר לפרקי הרוחב ולסינתזה: המידע הקיים מרוכז, התוצרים מוגדרים, המקורות מקושרים ומתויגים, המבנה האחיד נשמר, ותיאום מול הפרקים המפנים.'],end:['בקרת ניהול – סוף הפרק','אישור הפרק: עקביות עם פרק 1 ועם ה-TOR, תשומות לחמשת התחומים של תמ"א 1, המפות מרוכזות אצל גל, פערי הידע הועברו ל-12.9, והפרק מוכן להצגה בוועדת ההיגוי.']};
const cell = v => (Array.isArray(v)?v:[v]).map(t=> t.startsWith('!!') ? `<span class="ln"><span class="tag ${ownerCls(t)}">${esc(t.slice(2))}</span></span>` : `<span class="ln">${md(t)}</span>`).join('');
const isCmp = h => (h[0]==='סעיף'||h[0]==='רכיב') && h[2] && h[2].startsWith('תוצר');

function ownersOf(ch){ const s=new Set(); ch.items.forEach(it=>{ if(it[0]==='own') s.add(ownerCls(it[1])); if(it[0]==='tags') it[1].forEach(t=>s.add(ownerCls(t))); if(it[0]==='tbl') it[2].forEach(r=>r.forEach(c=>(Array.isArray(c)?c:[c]).forEach(t=>{ if(typeof t==='string'&&t.startsWith('!!')) s.add(ownerCls(t)); }))); }); return [...s]; }

function renderItems(items){
  let h='', open=0;
  const closeUl=()=>{ while(open>0){h+='</ul>';open--;} };
  items.forEach(it=>{
    const [k,a,b,c]=it;
    if(k==='b'){ const lvl=b||0; while(open<lvl+1){h+='<ul>';open++;} while(open>lvl+1){h+='</ul>';open--;} h+=`<li>${md(a)}</li>`; return; }
    closeUl();
    if(k==='h2') h+=`<h3>${esc(a)}</h3>`;
    else if(k==='h3') h+=`<h4>${esc(a)}</h4>`;
    else if(k==='p') h+=`<p>${md(a)}</p>`;
    else if(k==='tags') h+=`<p>${a.map(t=>`<span class="tag ${ownerCls(t)}">${esc(t.slice(2))}</span>`).join(' ')}</p>`;
    else if(k==='own') h+=`<p><span class="tag ${ownerCls(a)}">${esc(a.slice(2))}</span></p>`;
    else if(k==='ctrl') h+=`<div class="ctrl"><span class="tag t-michal">${esc(CTRL[a][0])}: מיכל</span><p>${esc(CTRL[a][1])}</p></div>`;
    else if(k==='tbl'){
      if(isCmp(a)) h+= b.map(r=>`<details class="cmp"><summary>${esc(r[0])} ${[...(Array.isArray(r[1])?r[1]:[]),...(Array.isArray(r[3])?r[3]:[])].filter(t=>t.startsWith('!!')).map(t=>`<span class="tag ${ownerCls(t)}">${esc(t.slice(2))}</span>`).join(' ')}</summary><div class="body"><div><div class="lbl">${esc(a[1])}</div>${cell((Array.isArray(r[1])?r[1]:[r[1]]).filter(t=>!t.startsWith('!!')))}</div><div><div class="lbl">${esc(a[2])}</div>${cell(r[2])}</div><div><div class="lbl">${esc(a[3])}</div>${cell((Array.isArray(r[3])?r[3]:[r[3]]).filter(t=>!t.startsWith('!!')))}</div></div></details>`).join('');
      else h+=`<div class="tw"><table><thead><tr>${a.map(x=>`<th>${md(x)}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(x=>`<td>${cell(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
  });
  closeUl(); return h;
}

const detail = document.getElementById('detail');
function showChapter(id, target){
  const ch = byId(id); const el = target||detail;
  el.innerHTML = `<div class="dh"><div><div class="lbl">פרק ${esc(ch.id)}</div><h2>${esc(ch.title)}</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="upl" data-upload="${esc(ch.id)}">העלאת חומרים לפרק</button>${target?'':'<button class="close" id="x">סגירה</button>'}</div></div>${renderItems(ch.items)}`;
  el.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>goUpload(b.dataset.upload));
  const fl = (typeof FILES!=='undefined') ? FILES.filter(x=>x.folder===id) : [];
  el.insertAdjacentHTML('beforeend', `<h3>חומרים בתיקיית הפרק (${fl.length})</h3>${fl.length?`<ul class="flist">${fl.map(itemHtml).join('')}</ul>`:'<p class="note">אין עדיין חומרים בתיקייה.</p>'}<button class="close" data-open-folder="${esc(id)}">לתיקיית הפרק</button>`);
  el.querySelector('[data-open-folder]').onclick=()=>{ setView('files'); openFolder(id); }; bindDel();
  el.hidden=false; if(!target){ document.getElementById('x').onclick=()=>{el.hidden=true}; el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); }
}
function showStage(s){
  detail.innerHTML = `<div class="dh"><div><div class="lbl">שלב ${s.n} · ${esc(s.m)} (${esc(rangeLbl(...s.cal))}) · אבן דרך ${esc(s.ms)}</div><h2>${esc(s.t)}</h2></div><button class="close" id="x">סגירה</button></div><h3>מה נעשה בשלב</h3><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h3>תוצר</h3><p>${esc(s.out)}</p>${s.cur?'<p>הפרקים של השלב מופיעים בתרשים שמתחת לשלבים. לוחצים על פרק כדי לראות את התוכן ומה נדרש בו.</p>':''}`;
  detail.hidden=false; document.getElementById('x').onclick=()=>{detail.hidden=true};
}
const node = (ch, cls='') => `<button class="node ${cls}" data-ch="${ch.id}"><span class="n">${ch.id}</span><b>${esc(ch.title)}</b><span class="dots">${ownersOf(ch).map(c=>`<span class="dot ${c}"></span>`).join('')}</span></button>`;

const shortM = n => monthDate(n).toLocaleDateString('he-IL',{month:'short'});
const shortR = (a,b) => `${shortM(a)}–${shortM(b)} ${String(monthDate(b).getFullYear()).slice(2)}`;
document.getElementById('stages').innerHTML = STAGES.map((s,i)=>`<button class="stage ${s.cur?'cur':''}" data-st="${i}" style="flex-grow:${s.cal[1]-s.cal[0]+1}"><span class="bar"></span><span class="sn">${s.n}</span><b>${esc(s.t)}</b><span class="m">${shortR(...s.cal)}</span></button>`).join('');
document.getElementById('st2-lbl').textContent=`מצב קיים וצרכים · ${shortR(3,8)}`;
document.getElementById('legend').innerHTML = OWNERS.map(o=>`<span class="lg" title="${esc(o.d)}"><span class="dot ${o.c}"></span>${esc(o.k)}</span>`).join('');
document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>showChapter(b.dataset.ch));
document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>showStage(STAGES[+b.dataset.st]));

// ---- domain view
const domPicker=document.getElementById('dom-picker');
const domList = CH.filter(c=>c.id!=='נ');
domPicker.innerHTML = domList.map(c=>`<button class="chip" data-d="${c.id}" aria-pressed="false">${c.id}. ${esc(c.title)}</button>`).join('');
function pickDom(id){ domPicker.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.d===id)); showChapter(id, document.getElementById('dom-detail')); store('dom',id); }
domPicker.querySelectorAll('.chip').forEach(b=>b.onclick=()=>pickDom(b.dataset.d));

// ---- people view
const TASKS = [];
CH.forEach(ch=>ch.items.forEach(it=>{ if(it[0]==='tbl' && isCmp(it[1])) it[2].forEach(r=>{ (Array.isArray(r[1])?r[1]:[]).filter(t=>t.startsWith('!!')).forEach(t=>TASKS.push({owner:t.replace('!!להשלמה: ',''), ch, row:r, head:it[1]})); (Array.isArray(r[3])?r[3]:[]).filter(t=>t.startsWith('!!')).forEach(t=>TASKS.push({owner:t.replace('!!להשלמה: ',''), ch, row:r, head:it[1], src:true})); }); }));
CH.forEach(ch=>ch.items.forEach(it=>{ if(it[0]==='own') TASKS.push({owner:'מיכל', ch, kind:'own', text:`**אחריות על פרק ${ch.id}: ${ch.title}** – כתיבה וריכוז הפרק`}); if(it[0]==='ctrl') TASKS.push({owner:'מיכל', ch, kind:'ctrl-'+it[1], text:`**${CTRL[it[1]][0]}** – ${CTRL[it[1]][1]}`}); }));
CH.forEach(ch=>ch.items.forEach(it=>{ if((it[0]==='b'||it[0]==='p') && it[1].includes('ריכוז המיפוי: גל')) TASKS.push({owner:'גל', ch, text:it[1]}); }));
const SLUG={'גל ונעמה':'gal-naama','נתי':'nati',"אנג'ל ורן":'angel-ran','הרן ויוחאי':'haran-yochai','לשיוך':'unassigned','גל':'gal','מיכל':'michal','נילי':'nili'};
{ const seen={}; TASKS.forEach(t=>{ let base = t.row ? `${SLUG[t.owner]||'x'}-${String(t.row[0]).split(' ')[0]}` : t.kind ? `${SLUG[t.owner]}-${t.kind}-${t.ch.id}` : `${SLUG[t.owner]||'x'}-map-${t.ch.id}`; seen[base]=(seen[base]||0)+1; t.id = seen[base]>1 ? base+'-'+seen[base] : base; t.title = t.row ? String(t.row[0]) + (t.src?' – השלמת מקורות':'') : t.kind ? (t.kind==='own'?'אחריות על הפרק':CTRL[t.kind.slice(5)][0]) : 'מיפוי: '+t.text.replace(/\*\*/g,'').slice(0,90); }); }
let DONE={};
const pplPicker=document.getElementById('ppl-picker');
pplPicker.innerHTML = OWNERS.map(o=>`<button class="chip" data-p="${esc(o.k)}" aria-pressed="false">${esc(o.k)}<span class="tag ${o.c}">${TASKS.filter(t=>t.owner===o.k).length}</span></button>`).join('');
function pickPerson(k){
  pplPicker.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===k));
  const mine=TASKS.filter(t=>t.owner===k); const chs=[...new Set(mine.map(t=>t.ch.id))];
  const o=OWNERS.find(x=>x.k===k);
  const nd=mine.filter(t=>DONE[t.id]).length;
  document.getElementById('ppl-sum').innerHTML = `<span><span class="tag ${o.c}">${esc(k)}</span> ${esc(o.d)}</span><span>בוצעו: <strong>${nd} מתוך ${mine.length}</strong></span><span class="prog" aria-hidden="true"><i style="width:${mine.length?Math.round(100*nd/mine.length):0}%"></i></span><span>פרקים: <strong>${chs.length}</strong></span>${DB?'':'<span>סימון משימות זמין למי שמחובר עם גישה לעמוד.</span>'}`;
  document.getElementById('ppl-list').innerHTML = chs.map(id=>{ const ch=byId(id); const rows=mine.filter(t=>t.ch.id===id);
    return `<article class="detail"><div class="dh"><div><div class="lbl">פרק ${esc(id)}</div><h2>${esc(ch.title)}</h2></div><button class="upl" data-upload="${esc(id)}">העלאת חומרים לפרק</button></div>${rows.map(t=>{ const box=`<label class="chk" onclick="event.stopPropagation()"><input type="checkbox" data-task="${esc(t.id)}" ${DONE[t.id]?'checked':''} ${DB?'':'disabled'} aria-label="בוצע: ${esc(t.title)}"></label>`; if(t.text) return `<details class="cmp ${DONE[t.id]?'done':''}" open><summary>${box}<span class="ttl">${esc(t.kind?t.title:'מיפוי')}</span></summary><div class="body" style="grid-template-columns:1fr"><div>${md(t.text)}</div></div></details>`; const r=t.row; return `<details class="cmp ${DONE[t.id]?'done':''}"><summary>${box}<span class="ttl">${esc(t.title)}</span></summary><div class="body"><div><div class="lbl">${esc(t.head[1])}</div>${cell(r[1].filter(x=>!x.startsWith('!!')))}</div><div><div class="lbl">${esc(t.head[2])}</div>${cell(r[2])}</div><div><div class="lbl">${esc(t.head[3])}</div>${cell((Array.isArray(r[3])?r[3]:[r[3]]).filter(x=>!x.startsWith('!!')))}</div></div></details>`; }).join('')}</article>`; }).join('');
  document.querySelectorAll('#ppl-list [data-upload]').forEach(b=>b.onclick=()=>goUpload(b.dataset.upload));
  document.querySelectorAll('#ppl-list [data-task]').forEach(cb=>cb.onchange=async()=>{
    const id=cb.dataset.task, val=cb.checked; DONE[id]=val; renderGantt(); pickPerson(k);
    try{ const by=USER?await USER.id():null; await DB.collection('tasks').doc(id).set({done:val,by,at:new Date().toISOString()}); }
    catch(e){ DONE[id]=!val; renderGantt(); pickPerson(k); const n=document.getElementById('ppl-sum'); n.insertAdjacentHTML('beforeend','<span class="msg err">השינוי לא נשמר. ייתכן שאין לך הרשאה לעדכן.</span>'); } });
  store('ppl',k); curPerson=k;
}
let curPerson=null;
function goUpload(id){ setView('files'); openFolder(id); const f=document.getElementById('file-'+id)||document.getElementById('lt-'+id); const fo=document.getElementById('folder'); if(fo) fo.scrollIntoView({block:'start'}); if(f) setTimeout(()=>f.focus(),50); }
// ---- gantt (TOR schedule)
const N=24;
const MILES=[{m:3,k:'1',p:'10%'},{m:8,k:'2',p:'20%'},{m:12,k:'3',p:'20%'},{m:16,k:'4',p:'15%'},{m:18,k:'5',p:'15%'},{m:24,k:'6',p:'15%'}];
const TODAY=(()=>{ const d=new Date(); const m=(d.getFullYear()-START.getFullYear())*12+(d.getMonth()-START.getMonth())+1; const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return m+(d.getDate()-1)/dim; })();
const pos=m=>`inset-inline-start:calc(${(m-1)/N*100}%)`;
const bar=(a,b,cls,pct)=>`<div class="gbar ${cls}" style="inset-inline-start:calc(${(a-1)/N*100}% + 2px);width:calc(${(b-a+1)/N*100}% - 4px)">${pct==null?'':`<i style="width:${pct}%"></i>`}</div>`;
const todayLine=()=> (TODAY>=1&&TODAY<=N+1)?`<span class="today" style="inset-inline-start:${(TODAY-1)/N*100}%" title="היום"></span>`:'';
function grow(label,inner,pct,cls='',attr=''){ return `<div class="gr ${cls}"><${attr?'button':'div'} class="gl" ${attr}>${label}</${attr?'button':'div'}><div class="trk">${inner}${todayLine()}</div><div class="gp">${pct==null?'':pct}</div></div>`; }
function chPct(id){ const ts=TASKS.filter(t=>t.ch.id===id); return ts.length?Math.round(100*ts.filter(t=>DONE[t.id]).length/ts.length):0; }
function renderPlant(){
  const el=document.getElementById('plant'); if(!el) return;
  const dots=ch=>ownersOf(ch).map(c=>`<span class="dot ${c}"></span>`).join('');
  const label=(ch,pct)=>`<span class="lt"><span class="n">${esc(ch.id)}</span><b>${esc(ch.title)}</b><span class="meta"><span class="dots">${dots(ch)}</span>${pct?`<span class="pc">${pct}%</span>`:''}</span></span>`;
  const syn=byId('13');
  let h=`<svg class="stem" viewBox="0 0 40 1000" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1000" d="M20 1000 C 12 860, 28 720, 20 580 S 12 300, 20 160 S 24 40, 20 0"/></svg>`;
  if(syn){ const pct=chPct('13'); h+=`<div class="crown"><button class="bud" data-ch="13" style="--p:${pct}"><svg viewBox="-40 -40 80 80" aria-hidden="true">${[0,60,120,180,240,300].map(a=>`<ellipse class="petal" cx="0" cy="-19" rx="10" ry="19" transform="rotate(${a})"/>`).join('')}<circle class="core" r="10"/></svg>${label(syn,pct)}</button></div>`; }
  const ids=['12','11','10','9','8','7','6','5','4','3','2'];
  ids.forEach((id,i)=>{ const ch=byId(id); if(!ch) return; const side=i%2?'l':'r'; const pct=chPct(id);
    h+=`<div class="lrow ${side}"><button class="leaf" data-ch="${esc(id)}" style="--p:${pct}"><svg class="blade" viewBox="0 0 124 48" aria-hidden="true"><path class="b" d="M3 24 C 26 2, 86 -2, 121 22 C 88 46, 28 46, 3 24 Z"/><path class="rib" d="M3 24 C 40 21, 84 20, 119 22"/><path class="vein" d="M34 23 L48 12 M34 24 L48 35 M62 22 L76 10 M62 23 L76 37 M88 22 L100 13 M88 22 L100 32"/></svg>${label(ch,pct)}</button></div>`; });
  h+=`<div class="roots"><svg class="rootlines" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M100 0 C 98 20, 70 30, 40 58 M100 0 C 102 22, 130 30, 160 58 M100 0 C 100 25, 96 40, 100 60"/></svg><div class="seeds">${['0','1'].map(id=>{const ch=byId(id); return ch?`<button class="seed" data-ch="${id}">${label(ch,chPct(id))}</button>`:'';}).join('')}</div></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>showChapter(b.dataset.ch));
}
function renderGantt(){
  let h='';
  // header: quarter ticks + stage bands
  let ticks=''; for(let m=1;m<=N;m++){ const d=monthDate(m); if(m===1||d.getMonth()===0) ticks+=`<span class="yr" style="inset-inline-start:${(m-1)/N*100}%">${d.getFullYear()}</span>`;
    ticks+=`<span class="tick" style="inset-inline-start:${(m-0.5)/N*100}%" title="חודש ${m} – ${monthLbl(m)}">${d.toLocaleDateString('he-IL',{month:'short'})}<br><span class="mn">${m}</span></span>`; }
  const bands=STAGES.map(st=>`<span class="band ${st.cur?'cur':''}" style="inset-inline-start:${(st.cal[0]-1)/N*100}%;width:${(st.cal[1]-st.cal[0]+1)/N*100}%"></span>`).join('');
  h+=`<div class="gr ghd"><div class="gl lbl">שלב / פעילות<br><span style="font-weight:400">המספר = חודש בתכנית</span></div><div class="trk">${ticks}${bands}</div><div class="gp lbl">בוצע</div></div>`;
  let all=0, done=0; const chRows=CH.filter(c=>c.id!=='נ').map(c=>{ const ts=TASKS.filter(t=>t.ch.id===c.id); const d=ts.filter(t=>DONE[t.id]).length; all+=ts.length; done+=d; return {c,ts,d,pct:ts.length?Math.round(100*d/ts.length):null}; });
  const st2pct = all?Math.round(100*done/all):0;
  const SUB={
    '1':[['הקמת צוות, ועדת היגוי, מתודולוגיה ומבנה מסד ה-GIS',1,2],['בחירת מסלול סטטוטורי ותיאום מקדים',2,3],['איסוף חומרים, סקרים משלימים ומדידות',1,6]],
    '3':[['תיקי מתחם, תשתיות נלוות ותעדוף',8,12],['שיתוף ציבור, סבב 2',11,12]],
    '4':[['תשריט, תקנון ונספחים',12,16],['מסמך סביבתי / תסקיר ותיאומים',13,18]],
    '5':[['תנאי סף, הצגה בוועדות והשלמות',18,24]]};
  STAGES.forEach(st=>{
    const [a,b]=st.cal;
    h+=grow(`שלב ${st.n} · ${esc(st.t)}`, bar(a,b,'gstb'+(st.cur?' cur':''), st.cur?st2pct:null), st.cur?st2pct+'%':'', 'gst', `data-gst="${st.n}"`);
    if(st.cur){
      chRows.forEach(({c,pct})=>{ h+=grow(`${esc(c.id)}. ${esc(c.title)}`, bar(3,8,c.id==='13'?'syn':(pct==null?'plain':''),pct), pct==null?'—':pct+'%', 'sub', `data-gch="${esc(c.id)}"`); });
      h+=grow('קומפילציה סטטוטורית ומצב המתחמים', bar(3,8,'plain',null), '', 'sub');
      h+=grow('שיתוף ציבור, סבב 1', bar(5,6,'plain',null), '', 'sub');
    } else (SUB[st.n]||[]).forEach(([t,x,y])=>{ h+=grow(esc(t), bar(x,y,'plain',null), '', 'sub'); });
  });
  h+=grow('<b>מסלולים במקביל</b>', bar(1,24,'gstb',null), '', 'gst');
  TRACKS.forEach(([t,x,y])=>{ h+=grow(esc(t), bar(x,y,'plain',null), '', 'sub'); });
  // steering committee + milestones
  const sc=new Set([...Array.from({length:8},(_,i)=>3*(i+1)),...MILES.map(x=>x.m)]);
  h+=grow('ועדת היגוי', [...sc].map(m=>`<span class="gsc" style="inset-inline-start:${(m-0.5)/N*100}%" title="ועדת היגוי – ${monthLbl(m)}"></span>`).join(''), '');
  h+=grow('<b>אבני דרך ותשלומים</b>', MILES.map(x=>`<span class="gml" style="inset-inline-start:${(x.m-0.5)/N*100}%">${x.k} · ${x.p}</span><span class="gms" style="top:70%;inset-inline-start:${(x.m-0.5)/N*100}%" title="${x.k} – ${monthLbl(x.m)}"></span>`).join(''), '');
  document.getElementById('gantt').innerHTML=h;
  renderPlant();
  document.getElementById('gantt-total').textContent=`שלב 2: בוצעו ${done} מתוך ${all} משימות (${st2pct}%)`;
  document.querySelectorAll('[data-gch]').forEach(b=>b.onclick=()=>showChapter(b.dataset.gch));
  document.querySelectorAll('[data-gst]').forEach(b=>b.onclick=()=>showStage(STAGES.find(x=>x.n===b.dataset.gst)));
}
renderGantt();

const FOLDERS=[{id:'bg',t:'חומרי רקע'},...CH.filter(c=>c.id!=='נ').map(c=>({id:c.id,t:`${c.id}. ${c.title}`}))];
const BG_CATS=['מסמכי העבודה','סקרי מצב קיים','תכניות סטטוטוריות','תכניות אב ואסטרטגיות','פרויקטי שיקום ופיתוח','מדריכים ומקורות','אחר'];
let FILES=[], DB=null, ASSETS=null, USER=null, curFolder=null;
const folderIcon='<svg viewBox="0 0 28 22" aria-hidden="true"><path d="M1 4a2 2 0 0 1 2-2h7l3 3h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="var(--water-soft)" stroke="var(--water)" stroke-width="1.5"/></svg>';
const fmtSize=b=>!b?'':b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const fmtDate=s=>{try{return new Date(s).toLocaleDateString('he-IL')}catch(e){return ''}};
function renderFolders(){
  document.getElementById('folders').innerHTML=FOLDERS.map(f=>{const n=FILES.filter(x=>x.folder===f.id).length;
    return `<button class="folder ${f.id==='bg'?'bg':''}" data-f="${f.id}" aria-pressed="${curFolder===f.id}">${folderIcon}<span class="fi"><b>${esc(f.t)}</b><span>${n} פריטים</span></span></button>`}).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>openFolder(b.dataset.f));
}
function itemHtml(x){
  const href = x.kind==='link' ? x.url : (x.assetId ? '/_blob/'+x.assetId : '#');
  const kind = x.kind==='link' ? '<span class="kind link">קישור</span>' : `<span class="kind">${esc((x.ext||'קובץ').toUpperCase())}</span>`;
  return `<li>${kind}<a href="${esc(href)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.note?`<span class="meta" style="margin-inline-start:0">${esc(x.note)}</span>`:''}<span class="meta">${fmtSize(x.size)} ${x.at?fmtDate(x.at):''}</span>${DB?`<button class="del" data-del="${esc(x._id)}">הסרה</button>`:''}</li>`;
}
function folderListHtml(id){
  const items=FILES.filter(x=>x.folder===id).sort((a,b)=>(a.order??999)-(b.order??999)||String(b.at||'').localeCompare(String(a.at||'')));
  if(!items.length) return '<p class="note">התיקייה ריקה עדיין. אפשר להעלות קובץ או להוסיף קישור.</p>';
  if(id!=='bg') return `<ul class="flist">${items.map(itemHtml).join('')}</ul>`;
  return BG_CATS.map(c=>{const it=items.filter(x=>(x.cat||'אחר')===c); return it.length?`<div class="cat">${esc(c)}</div><ul class="flist">${it.map(itemHtml).join('')}</ul>`:''}).join('');
}
function addFormsHtml(id){
  if(!DB) return '<p class="note">כדי להוסיף חומרים צריך להיות מחוברים ולקבל גישה לעמוד.</p>';
  const cat = id==='bg' ? `<label for="cat-${id}">קטגוריה</label><select id="cat-${id}">${BG_CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select>` : '';
  return `<div class="add">
    <form id="upf">${cat?`<div>${cat}</div>`:''}
      <label for="file-${id}">העלאת קובץ (PDF, JPG, PNG)</label>
      <input type="file" id="file-${id}" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,application/pdf,image/jpeg,image/png" multiple ${ASSETS?'':'disabled'}>
      <button type="submit" ${ASSETS?'':'disabled'}>העלאה</button>
      <div class="msg" id="upmsg">${ASSETS?'עד 20MB לקובץ. קובצי Word יש לשמור כ-PDF או להוסיף כקישור.':'העלאת קבצים זמינה רק למי שיש לו הרשאת עריכה לעמוד. אפשר להוסיף קישור.'}</div>
    </form>
    <form id="lnf">
      <label for="lt-${id}">הוספת קישור (למשל קובץ Word ב-Drive או ב-SharePoint)</label>
      <input type="text" id="lt-${id}" placeholder="שם החומר" required>
      <input type="url" id="lu-${id}" placeholder="https://…" required>
      <button type="submit">הוספה</button>
      <div class="msg" id="lnmsg"></div>
    </form></div>`;
}
function openFolder(id){
  curFolder=id; const f=FOLDERS.find(x=>x.id===id); const el=document.getElementById('folder');
  el.innerHTML=`<div class="dh"><div><div class="lbl">תיקייה</div><h2>${esc(f.t)}</h2></div>${id!=='bg'?`<button class="close" id="goch">פתיחת הפרק</button>`:''}</div><div id="flist-wrap">${folderListHtml(id)}</div>${addFormsHtml(id)}`;
  el.hidden=false; renderFolders(); bindFolder(id); store('folder',id);
  const g=document.getElementById('goch'); if(g) g.onclick=()=>{setView('dom'); pickDom(id);};
}
function bindDel(){ document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
  if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='לאשר הסרה?'; return; }
  b.disabled=true; try{ await DB.collection('files').doc(b.dataset.del).delete(); }catch(e){ b.textContent='לא ניתן להסיר'; } }); }
function bindFolder(id){
  bindDel(); if(!DB) return;
  const up=document.getElementById('upf'), ln=document.getElementById('lnf');
  up.onsubmit=async ev=>{ev.preventDefault(); const inp=document.getElementById('file-'+id), msg=document.getElementById('upmsg');
    const cat=id==='bg'?document.getElementById('cat-'+id).value:null; const files=[...(inp.files||[])]; if(!files.length){msg.textContent='לא נבחר קובץ.';return;}
    let ok=0, bad=[];
    for(const f of files){ const ext=(f.name.split('.').pop()||'').toLowerCase();
      if(ext==='doc'||ext==='docx'){ bad.push(f.name+' (Word – לשמור כ-PDF או להוסיף כקישור)'); continue; }
      const type = ext==='pdf'?'application/pdf':ext==='png'?'image/png':(ext==='jpg'||ext==='jpeg')?'image/jpeg':f.type;
      msg.className='msg'; msg.textContent='מעלה את '+f.name+'…';
      try{ const r=await ASSETS.upload(f,{type}); const by=USER?await USER.id():null;
        await DB.collection('files').add({folder:id,title:f.name.replace(/\.[^.]+$/,''),kind:'file',assetId:r.id,ext,size:r.sizeBytes,at:new Date().toISOString(),by,cat});
        ok++; }catch(e){ bad.push(f.name+(e&&e.code==='payload_too_large'?' (גדול מ-20MB)':e&&e.code==='unsupported_type'?' (סוג קובץ לא נתמך)':'')); }
    }
    msg.className=bad.length?'msg err':'msg'; msg.textContent=(ok?`הועלו ${ok} קבצים. `:'')+(bad.length?'לא הועלו: '+bad.join(', '):''); inp.value='';};
  ln.onsubmit=async ev=>{ev.preventDefault(); const t=document.getElementById('lt-'+id).value.trim(), u=document.getElementById('lu-'+id).value.trim(), msg=document.getElementById('lnmsg');
    if(!/^https?:\/\//.test(u)){msg.className='msg err';msg.textContent='הקישור צריך להתחיל ב-https://';return;}
    const cat=id==='bg'?document.getElementById('cat-'+id).value:null;
    try{ const by=USER?await USER.id():null; await DB.collection('files').add({folder:id,title:t,kind:'link',url:u,at:new Date().toISOString(),by,cat}); msg.className='msg'; msg.textContent='הקישור נוסף.'; ln.reset(); }
    catch(e){ msg.className='msg err'; msg.textContent='לא ניתן להוסיף. ייתכן שאין לך הרשאת עריכה לעמוד.'; } };
}
function refreshFolder(){ if(!curFolder) return; const w=document.getElementById('flist-wrap'); if(w){ w.innerHTML=folderListHtml(curFolder); bindDel(); } }

function itemHtml(x){
  const ext=(x.ext||(x.url||'').split('.').pop()||'').toUpperCase();
  const kind = x.kind==='link' ? '<span class="kind link">קישור</span>' : `<span class="kind">${esc(x.kind==='internal'?'פנימי':(ext||'קובץ'))}</span>`;
  const title = x.kind==='internal' ? `<span>${esc(x.title)}</span>` : `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`;
  const alt = x.alt ? ` <a class="meta" href="${esc(x.alt)}" style="margin-inline-start:0">Word</a>` : '';
  const note = x.kind==='internal' ? 'נמצא בעמוד הצוות ב-claude.ai' : (x.note||'');
  return `<li>${kind}${title}${alt}${note?`<span class="meta" style="margin-inline-start:0">${esc(note)}</span>`:''}<span class="meta">${fmtSize(x.size)}</span></li>`;
}
